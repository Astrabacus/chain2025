<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Chain2025 — Chronik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/portal.css">
</head>

<body>

<!-- Header dynamisch laden -->
<div id="header"></div>
<script>
  fetch("/header.html")
    .then(r => r.text())
    .then(html => document.getElementById("header").innerHTML = html)
    .catch(err => console.error("Header konnte nicht geladen werden:", err));
</script>

<div class="wrap">
  <span class="tag">Chain2025</span>
  <h1>Chronik</h1>

  <p>Dynamische Timeline aus <code>chronik.json</code>.</p>

  <p style="opacity:.85; margin-top:1rem;">
    Die Chronik ist das operative Gedächtnis der Genesis‑Plattform.
    Sie zeigt alle signierten Ereignisse, Rituale und State‑Transitions
    in ihrer exakten zeitlichen Reihenfolge — vollständig deterministisch
    und reproduzierbar.
  </p>

  <div id="timeline" class="timeline"></div>
</div>

<script>
async function loadChronik() {
  try {
    const response = await fetch("chronik.json");
    const data = await response.json();

    const events = [
      data.chain2025.genesis,
      ...data.chain2025.echo,
      data.chain2025.closure
    ];

    // Sortieren nach Timestamp
    events.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

    const timeline = document.getElementById("timeline");
    timeline.innerHTML = events.map(ev => `
      <div class="entry">
        <div class="date">${ev.id}</div>
        <div class="title">${ev.title}</div>
        <div class="desc">${ev.description}</div>
      </div>
    `).join("");

  } catch (err) {
    console.error("Chronik konnte nicht geladen werden:", err);
    document.getElementById("timeline").innerHTML =
      "<p style='color:red;'>Chronik konnte nicht geladen werden.</p>";
  }
}

loadChronik();
</script>

</body>
</html>
